name: kpos-fullstack

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kpos-secret
      POSTGRES_DB: kpos_db
    ports:
      - "5432:5432"
    volumes:
      - kpos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kpos_db"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - kpos-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate-and-seed:
    build:
      context: ../k-pos-be
    command: sh -c "npx prisma migrate deploy && node dist/prisma/seed.js"
    environment: &api-environment
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: /api/v1
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080
      DATABASE_URL: postgresql://postgres:kpos-secret@postgres:5432/kpos_db?schema=public
      DIRECT_URL: postgresql://postgres:kpos-secret@postgres:5432/kpos_db?schema=public
      DATABASE_SSL: "false"
      DATABASE_POOL_MAX: "32"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RABBITMQ_PREFETCH: "8"
      REPORTING_BATCH_SIZE: "100"
      REPORTING_CONCURRENCY: "4"
      JWT_SECRET: local-docker-jwt-secret-change-outside-demo
      OFFLINE_LEASE_SECRET: local-docker-offline-secret-change-outside-demo
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../k-pos-be
    environment: *api-environment
    expose:
      - "3001"
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kpos-postgres-data:
  kpos-rabbitmq-data:
