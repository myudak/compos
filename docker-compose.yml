services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: operator
      POSTGRES_DB: operator_pos
    ports:
      - "5432:5432"
    volumes:
      - operator-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator_pos"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  operator-postgres-data:
