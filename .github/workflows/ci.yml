name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: operator
          POSTGRES_PASSWORD: operator
          POSTGRES_DB: operator_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U operator -d operator_pos"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgres://operator:operator@127.0.0.1:5432/operator_pos
      JWT_SECRET: ci-only-operator-pos-secret
      DEVICE_ACTIVATION_CODE: COMPOS-DEMO
      CORS_ORIGIN: http://127.0.0.1:4173
      CI: true

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @operator/web exec playwright install --with-deps chromium
      - run: pnpm db:reset
      - run: pnpm format:check
      - run: pnpm docs:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm test:load
      - run: pnpm test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            apps/operator-web/playwright-report
            apps/operator-web/test-results
          if-no-files-found: ignore
