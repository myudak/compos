name: Cross-repo CI

on:
  push:
  pull_request:

concurrency:
  group: kpos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: true
      KPOS_BACKEND_REF: e3da70f7f16d290133f6a006f01e3d0e65f1201f

    steps:
      - name: Checkout K-POS frontends
        uses: actions/checkout@v4
        with:
          path: project_COMPPOS

      - name: Checkout canonical backend
        uses: actions/checkout@v4
        with:
          repository: SEA18-3/k-pos-be
          ref: ${{ env.KPOS_BACKEND_REF }}
          path: k-pos-be

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: project_COMPPOS/pnpm-lock.yaml

      - name: Install frontend workspaces
        working-directory: project_COMPPOS
        run: pnpm install --frozen-lockfile

      - name: Install backend
        working-directory: k-pos-be
        run: npm ci

      - name: Backend static verification
        working-directory: k-pos-be
        run: npm run lint && npm test -- --runInBand && npm run build

      - name: OpenAPI contract drift
        working-directory: project_COMPPOS
        run: pnpm openapi:check

      - name: Frontend verification
        working-directory: project_COMPPOS
        run: pnpm format:check && pnpm docs:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build

      - name: Start production-like stack
        working-directory: project_COMPPOS
        run: docker compose up -d --build

      - name: PostgreSQL and RabbitMQ integration
        working-directory: project_COMPPOS
        run: pnpm test:integration

      - name: Install Playwright browser
        working-directory: project_COMPPOS
        run: pnpm --filter @k-pos/operator-web exec playwright install --with-deps chromium

      - name: Three-PWA end-to-end and Rabbit degraded mode
        working-directory: project_COMPPOS
        run: pnpm test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure
          path: |
            project_COMPPOS/apps/operator-web/playwright-report
            project_COMPPOS/apps/operator-web/test-results
          if-no-files-found: ignore

      - name: Container diagnostics
        if: failure()
        working-directory: project_COMPPOS
        run: docker compose ps && docker compose logs --tail 300

      - name: Stop stack
        if: always()
        working-directory: project_COMPPOS
        run: docker compose down
